<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mor — hooray!</title>
  <desc id="desc">A round blue peacock celebrates with both wings raised, joyful closed eyes and feet kicked out in a happy jump. Seven emerald tail feathers have gold and teal eye spots. He wears an ivory dhoti with a gold zari border and pleated front fall, above orange feet.</desc>
